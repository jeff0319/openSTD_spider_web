<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenSTD Spider Web</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f4;
      --panel: #ffffff;
      --text: #19201d;
      --muted: #65716a;
      --line: #dce3de;
      --accent: #0b6b54;
      --accent-dark: #084f40;
      --danger: #b42318;
      --soft: #eef5f1;
      --warn: #956100;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
    }
    .tagline {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 22px 40px;
      display: grid;
      gap: 18px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 136px 128px 108px auto;
      gap: 10px;
      align-items: end;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }
    input, select, button {
      height: 40px;
      border-radius: 6px;
      border: 1px solid var(--line);
      font: inherit;
      letter-spacing: 0;
    }
    input, select {
      width: 100%;
      padding: 0 11px;
      background: #fff;
      color: var(--text);
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 650;
      white-space: nowrap;
    }
    button.secondary {
      background: #fff;
      color: var(--accent);
      border-color: #a9c7bd;
    }
    .button-link {
      height: 40px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }
    button:disabled {
      cursor: wait;
      opacity: .65;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h2 {
      margin: 0;
      font-size: 16px;
    }
    .muted {
      color: var(--muted);
      font-size: 13px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }
    th {
      color: var(--muted);
      background: #fbfcfb;
      font-size: 12px;
      font-weight: 700;
    }
    tr {
      cursor: pointer;
    }
    tr:hover td {
      background: var(--soft);
    }
    .code {
      font-weight: 750;
      color: var(--accent-dark);
      overflow-wrap: anywhere;
    }
    .name {
      overflow-wrap: anywhere;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 700;
    }
    .pill.cached {
      margin-top: 6px;
      background: #fff4db;
      color: var(--warn);
    }
    .pager {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .pager-actions {
      display: flex;
      gap: 8px;
    }
    .detail {
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .detail-title {
      display: grid;
      gap: 8px;
    }
    .detail-title strong {
      font-size: 19px;
      overflow-wrap: anywhere;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 9px 12px;
      font-size: 14px;
    }
    .meta-grid span:nth-child(odd) {
      color: var(--muted);
    }
    .meta-grid span:nth-child(even) {
      overflow-wrap: anywhere;
    }
    .switch {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
    }
    .switch input {
      width: 18px;
      height: 18px;
    }
    .download-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding-top: 2px;
    }
    .download-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .progress {
      height: 10px;
      background: #e6ece8;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width .25s ease;
    }
    .message {
      min-height: 22px;
      color: var(--muted);
      font-size: 14px;
    }
    .message.error {
      color: var(--danger);
      font-weight: 650;
    }
    .empty {
      padding: 34px 16px;
      color: var(--muted);
      text-align: center;
    }
    a {
      color: var(--accent-dark);
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 860px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }
      .tagline {
        white-space: normal;
      }
      .toolbar, .layout, .download-row {
        grid-template-columns: 1fr;
      }
      .download-actions {
        justify-content: stretch;
      }
      .download-actions > * {
        flex: 1 1 150px;
      }
      th:nth-child(4), td:nth-child(4),
      th:nth-child(5), td:nth-child(5) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>OpenSTD Spider Web</h1>
      <div class="tagline">国家标准全文公开系统下载工具</div>
    </div>
  </header>

  <main>
    <form class="toolbar" id="searchForm">
      <label>关键字或标准编号
        <input id="keyword" placeholder="例如 GB 18030 或 电动自行车" autocomplete="off">
      </label>
      <label>状态
        <select id="status">
          <option value="">全部</option>
          <option value="PUBLISHED">现行</option>
          <option value="TOBEIMP">即将实施</option>
          <option value="WITHDRAWN">废止</option>
          <option value="NOTIMP">暂不实施</option>
        </select>
      </label>
      <label>类型
        <select id="stdType">
          <option value="">全部</option>
          <option value="GB">GB</option>
          <option value="GBT">GB/T</option>
          <option value="GBZ">GB/Z</option>
        </select>
      </label>
      <label>每页
        <select id="pageSize">
          <option>10</option>
          <option>20</option>
          <option>30</option>
          <option>50</option>
        </select>
      </label>
      <button id="searchBtn" type="submit">搜索</button>
    </form>

    <section class="layout">
      <div class="panel">
        <div class="panel-head">
          <h2>搜索结果</h2>
          <span class="muted" id="resultMeta">尚未搜索</span>
        </div>
        <div id="results">
          <div class="empty">输入关键字后搜索，点击结果即可查看详情</div>
        </div>
        <div class="pager">
          <span class="muted" id="pageInfo">第 1 页</span>
          <div class="pager-actions">
            <button type="button" class="secondary" id="prevPage">上一页</button>
            <button type="button" class="secondary" id="nextPage">下一页</button>
          </div>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-head">
          <h2>标准详情</h2>
          <span class="muted" id="detailState">未选择</span>
        </div>
        <div class="detail" id="detail">
          <div class="empty">从左侧选择一条标准，或搜索完整标准编号后下载</div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const state = { page: 1, totalPage: 1, selected: null, jobTimer: null };
    const $ = (id) => document.getElementById(id);

    function setLoading(loading) {
      $("searchBtn").disabled = loading;
      $("searchBtn").textContent = loading ? "搜索中" : "搜索";
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.detail || "请求失败");
      }
      return data;
    }

    function fmt(value) {
      return value || "无";
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderResults(data) {
      state.totalPage = data.total_page || 1;
      $("resultMeta").textContent = `共 ${data.total_item} 条`;
      $("pageInfo").textContent = `第 ${data.page} / ${state.totalPage} 页`;

      if (!data.items.length) {
        $("results").innerHTML = '<div class="empty">没有找到匹配的标准</div>';
        return;
      }

      const rows = data.items.map(item => `
        <tr data-id="${item.id}">
          <td><div class="code">${esc(item.std_code)}</div></td>
          <td><div class="name">${esc(item.name_cn)}</div></td>
          <td>
            <span class="pill">${esc(item.status_name || item.status)}</span>
            ${item.cached ? '<br><span class="pill cached">已下载</span>' : ''}
          </td>
          <td>${esc(fmt(item.pub_date))}</td>
          <td>${esc(fmt(item.impl_date))}</td>
        </tr>
      `).join("");

      $("results").innerHTML = `
        <table>
          <thead>
            <tr>
              <th style="width: 160px">标准编号</th>
              <th>名称</th>
              <th style="width: 92px">状态</th>
              <th style="width: 112px">发布日期</th>
              <th style="width: 112px">实施日期</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      document.querySelectorAll("tr[data-id]").forEach(row => {
        row.addEventListener("click", () => loadMeta(row.dataset.id));
      });
    }

    async function search(page = 1) {
      setLoading(true);
      try {
        state.page = page;
        const data = await request("/api/search", {
          method: "POST",
          body: JSON.stringify({
            keyword: $("keyword").value,
            ps: Number($("pageSize").value),
            pn: state.page,
            status: $("status").value,
            std_type: $("stdType").value
          })
        });
        renderResults(data);
      } catch (err) {
        $("results").innerHTML = `<div class="empty">${err.message}</div>`;
      } finally {
        setLoading(false);
      }
    }

    async function loadMeta(target) {
      $("detailState").textContent = "读取中";
      $("detail").innerHTML = '<div class="empty">正在读取标准详情</div>';
      try {
        const item = await request(`/api/meta?target=${encodeURIComponent(target)}`);
        state.selected = item;
        $("detailState").textContent = item.status_name || item.status;
        const cachedActions = item.cached
          ? `<a class="button-link" href="${esc(item.file_url)}" target="_blank" rel="noopener">打开已下载</a>
             <button type="button" class="secondary" id="redownloadBtn">重新下载</button>`
          : '<button type="button" id="downloadBtn">下载 PDF</button>';
        $("detail").innerHTML = `
          <div class="detail-title">
            <strong>${esc(item.std_code)}</strong>
            <span>${esc(item.name_cn)}</span>
            <span class="muted">${esc(fmt(item.name_en))}</span>
          </div>
          <div class="meta-grid">
            <span>预览</span><span>${item.allow_preview ? "允许" : "禁止"}</span>
            <span>下载</span><span>${item.allow_download ? "允许" : "禁止"}</span>
            <span>CCS</span><span>${esc(fmt(item.ccs))}</span>
            <span>ICS</span><span>${esc(fmt(item.ics))}</span>
            <span>发布日期</span><span>${esc(fmt(item.pub_date))}</span>
            <span>实施日期</span><span>${esc(fmt(item.impl_date))}</span>
            <span>主管部门</span><span>${esc(fmt(item.maintenance_depat))}</span>
            <span>归口部门</span><span>${esc(fmt(item.centralized_depat))}</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="forcePreview">
            强制使用预览方式生成 PDF
          </label>
          <div class="download-row">
            <div>
              <div class="progress"><div class="bar" id="bar"></div></div>
              <div class="message" id="jobMessage">${item.cached ? `已下载：${esc(item.filename)}` : "准备就绪"}</div>
            </div>
            <div class="download-actions">${cachedActions}</div>
          </div>
        `;
        if ($("downloadBtn")) $("downloadBtn").addEventListener("click", () => startDownload(false));
        if ($("redownloadBtn")) $("redownloadBtn").addEventListener("click", () => startDownload(true));
      } catch (err) {
        $("detailState").textContent = "失败";
        $("detail").innerHTML = `<div class="empty">${err.message}</div>`;
      }
    }

    async function startDownload(forceRedownload = false) {
      if (!state.selected) return;
      const buttons = document.querySelectorAll(".download-actions button");
      buttons.forEach(button => button.disabled = true);
      $("jobMessage").textContent = "创建下载任务";
      $("bar").style.width = "0%";
      try {
        const job = await request("/api/download", {
          method: "POST",
          body: JSON.stringify({
            target: state.selected.id,
            force_preview: $("forcePreview").checked,
            force_redownload: forceRedownload
          })
        });
        pollJob(job.id);
      } catch (err) {
        $("jobMessage").textContent = err.message;
        $("jobMessage").className = "message error";
        buttons.forEach(button => button.disabled = false);
      }
    }

    async function pollJob(jobId) {
      clearTimeout(state.jobTimer);
      try {
        const job = await request(`/api/jobs/${jobId}`);
        $("bar").style.width = `${job.progress || 0}%`;
        $("jobMessage").className = job.status === "error" ? "message error" : "message";
        $("jobMessage").innerHTML = job.status === "done"
          ? `下载完成：<a href="${job.file_url}" target="_blank" rel="noopener">打开 PDF</a>`
          : (job.error || job.stage || "处理中");
        if (job.status === "done" || job.status === "error") {
          document.querySelectorAll(".download-actions button").forEach(button => button.disabled = false);
          if (job.status === "done") {
            state.selected.cached = true;
            state.selected.file_url = job.file_url;
            state.selected.filename = job.filename || state.selected.filename;
          }
          return;
        }
        state.jobTimer = setTimeout(() => pollJob(jobId), 900);
      } catch (err) {
        $("jobMessage").textContent = err.message;
        $("jobMessage").className = "message error";
        document.querySelectorAll(".download-actions button").forEach(button => button.disabled = false);
      }
    }

    $("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      search(1);
    });
    $("prevPage").addEventListener("click", () => {
      if (state.page > 1) search(state.page - 1);
    });
    $("nextPage").addEventListener("click", () => {
      if (state.page < state.totalPage) search(state.page + 1);
    });
  </script>
</body>
</html>
